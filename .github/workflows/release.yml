name: Release VSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify release tag matches extension version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const expectedTag = `v${version}`;

          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`Release tag must be ${expectedTag}, received ${process.env.RELEASE_TAG}.`);
            process.exit(1);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Package extension
        run: >-
          npx --yes @vscode/vsce package
          --no-dependencies
          --allow-star-activation
          --out "vscode-extension-open-workspace-${{ steps.metadata.outputs.version }}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: vscode-extension-open-workspace-${{ steps.metadata.outputs.version }}.vsix
